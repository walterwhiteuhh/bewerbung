# Für die CLI: `uv run alembic revision --autogenerate -m "..."`
[alembic]
script_location = src/bewerbung/db/migrations
sqlalchemy.url = sqlite:///data/bewerbung.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
